name: Daily HoYoLAB Automation

on:
  schedule:
    # 00:05 ICT (UTC+7) — daily check-in + code redeem
    - cron: "5 17 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore redeem code cache
        uses: actions/cache@v4
        with:
          path: data
          key: hoyolab-state-v1

      - name: Install
        run: pip install .

      - name: Run check-in and code redeem
        env:
          HOYOLAB_COOKIE: ${{ secrets.HOYOLAB_COOKIE }}
          ENABLE_GENSHIN: "true"
          ENABLE_HSR: "true"
          LOG_LEVEL: INFO
        run: hoyo-auto run
