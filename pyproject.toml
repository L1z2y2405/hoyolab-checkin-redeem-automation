[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoyo-auto"
version = "1.0.0"
description = "Personal HoYoLAB automation for Genshin Impact and Honkai: Star Rail check-in and code redemption."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Personal use" }]
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
hoyo-auto = "hoyo_auto.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hoyo_auto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
